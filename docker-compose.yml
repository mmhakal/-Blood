version: '3.8'

services:
  # ------------------------------------------------------------
  # PostgreSQL Database Service
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mediflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_production_pwd_123}
      POSTGRES_DB: ${POSTGRES_DB:-mediflow_lis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediflow_admin} -d ${POSTGRES_DB:-mediflow_lis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # MediFlow LIS API & Application Server
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediflow_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-mediflow_admin}:${POSTGRES_PASSWORD:-change_me_production_pwd_123}@postgres:5432/${POSTGRES_DB:-mediflow_lis}
      JWT_SECRET: ${JWT_SECRET:-mediflow_production_random_jwt_secret_64chars_long_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-mediflow_production_refresh_token_secret_64chars_key}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------
  # Nginx Production Reverse Proxy & SSL Gateway
  # ------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: mediflow_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/nginx/certs:ro

volumes:
  postgres_data:
  uploads_data:
  certs_data:
